[project]
name = "obfuscator"
version = "0.6.2"
description = "Лексический обфускатор проекта для безопасной работы с LLM-агентом"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pathspec>=1.1"]

[project.scripts]
obfuscator = "obfuscator.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obfuscator"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "PT", "RUF"]
# Документация и сообщения на русском: кириллица — не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = ["slow: долгие проверки (производительность); запуск: uv run pytest -m slow"]
