# Пример словаря obfuscator (синтетические данные).
# Ключ — оригинал (с учётом регистра), значение — алиас. Порядок правил не важен.
# Каждое написание оригинала — отдельное правило: замена учитывает регистр, а проверка утечек — нет.
# Оригинал с точкой — в кавычках. Рабочие словари — в dictionaries/<проект>.toml (каталог игнорируется git).

# Правила подстроки: заменяются везде, в том числе внутри слов. Для длинных, специфичных оригиналов.
[rules]
"Pepelac" = "Zqv"
"pepelac" = "zqv"
"PEPELAC" = "ZQV"
"PepelacBig" = "Wmr"
"db.pepelac.internal" = "host-a7.example"
"Ivan Petrov" = "Person One"
"s3cr3t-t0ken-42" = "tok-0001"

# Правила по словам: только на границе слова — рядом не буква или переход регистра camelCase.
# Для коротких оригиналов: "sim" заменится в sim-x, _sim, sim2, simClient, но не в simple.
# Первый и последний символ алиаса — того же вида, что у оригинала (строчная / заглавная / не буква).
[words]
"sim" = "qx"
"Sim" = "Qx"
"SIM" = "QX"
